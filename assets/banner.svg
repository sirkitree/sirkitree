<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="sirkitree — VR, AR and AI Strategy, Design, Development">
  <defs>
    <pattern id="hex" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0l25.98 15v30L30 60 4.02 45V15z" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#26FFCE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6A00FF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#26FFCE"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#111117"/>
  <rect width="1200" height="300" fill="url(#hex)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <g fill="#00FFFF" filter="url(#glow)">
    <path d="M150 60l25.98 15v30L150 120 124.02 105V75z" opacity="0.18">
      <animate attributeName="opacity" values="0.05;0.30;0.05" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M1050 180l25.98 15v30L1050 240 1024.02 225V195z" fill="#26FFCE" opacity="0.14">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M990 60l25.98 15v30L990 120 964.02 105V75z" fill="#6A00FF" opacity="0.20">
      <animate attributeName="opacity" values="0.08;0.28;0.08" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M210 180l25.98 15v30L210 240 184.02 225V195z" opacity="0.10">
      <animate attributeName="opacity" values="0.20;0.04;0.20" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="Oswald, 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="34" fill="#00FFFF" letter-spacing="14" opacity="0.9">VR &#183; AR &#183; AI STUDIO</text>
    <text x="600" y="205" font-size="92" fill="url(#title)" letter-spacing="6" filter="url(#glow)">sirkitree</text>
    <text x="600" y="250" font-size="24" fill="#8a8a9a" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2">strategy &#183; design &#183; development &#183; project management</text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="#00FFFF" opacity="0.35"/>
</svg>
